# Nginx configuration for Next.js SPA routing
# Place in /etc/nginx/sites-available/imagineme

server {
    listen 80;
    server_name imaginemebylovie.com www.imaginemebylovie.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imaginemebylovie.com www.imaginemebylovie.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/imaginemebylovie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imaginemebylovie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CORS Configuration
    add_header Access-Control-Allow-Origin "https://imaginemebylovie.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Next.js Static Files
    location /_next/static {
        alias /var/www/imagineme/.next/static;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static Assets
    location /static {
        alias /var/www/imagineme/static;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images
    location /images {
        alias /var/www/imagineme/public/images;
        add_header Cache-Control "public, max-age=86400";
    }

    # API Proxy (optional - if proxying API requests)
    location /api/ {
        proxy_pass https://imaginemebylovie.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin "https://imaginemebylovie.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Next.js Pages (SPA routing)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Client upload size
    client_max_body_size 10M;
}